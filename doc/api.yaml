openapi: 3.0.3
info:
  title: WASAphoto API
  version: 1.0.0
  description: Simplified photo sharing and social interaction API for the WASAphoto service.

servers:
  - url: https://api.wasaphoto.com/v1
    description: Main Production Server

tags:
  - name: Authentication
    description: Endpoints related to user authentication
  - name: User
    description: Endpoints for user profile management
  - name: Photo
    description: Endpoints for managing photos
  - name: Social
    description: Endpoints for social interactions like comments and likes

paths:

  /session:
    post:
      tags: [ Authentication ]
      summary: Log in a user
      description: This endpoint registers a new user or logs in an existing one based on the username provided. No password is required. Returns a user identifier for use in subsequent API calls.
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Login identifier used for authentication
              type: object
              required: [ username ]
              properties:
                username:
                  description: The username of the user attempting to log in or register.
                  type: string
                  pattern: '^.*?$'
                  example: "Maria"
                  minLength: 3
                  maxLength: 16
      responses:
        201:
          description: User successfully registered or logged in
          content:
            application/json:
              schema:
                description: The response object containing the unique user identifier, returned upon successful user registration or login. This `userId` is used to identify the user in subsequent API requests.
                type: object
                properties:
                  userId:
                    type: string
                    description: A unique identifier assigned to the user, which can be used for authentication and other operations within the system.
                    example: "user123"
                    pattern: '^.*?$'
                    minLength: 3
                    maxLength: 16
        400:
          $ref: '#/components/responses/badRequest'
        500:
          $ref: '#/components/responses/internalServerError'

  /users:
    get:
      tags: [ "Users" ]
      summary: Get user profiles
      description: Retrieve user profiles based on search criteria. A user can find another user's profile only if they are not banned by the target user. Multiple users might partially match the search criteria.
      operationId: getUserProfiles

      parameters:
        - $ref: "#/components/parameters/query_id"


      responses:
        '200':
          description: A list of user profiles that match the search criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/users_list"

        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '500':
          $ref: '#/components/responses/internalServerError'

      security:
        - bearerAuth: [ ]


  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/userId'
    get:
      tags: [ User ]
      description: This endpoint retrieves the profile information of the user identified by the provided user ID. The response includes basic user details such as username, nickname, and other relevant profile information.
      summary: Retrieve user profile
      operationId: getUserProfile
      responses:
        200:
          $ref: '#/components/responses/userProfile'
        404:
          $ref: '#/components/responses/notFound'
        500:
          $ref: '#/components/responses/internalServerError'
      security:
        - bearerAuth: [ ]
    put:
      tags: [ User ]
      description: This endpoint allows an authenticated user to update their nickname. The new nickname must meet the specified validation requirements, including length and format.
      summary: Update user nickname
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: A schema to update the user's nickname
              type: object
              properties:
                nickname:
                  type: string
                  description: The new nickname that the user wants to set. Must be between 3 and 16 characters.
                  example: "NewNickname"
                  minLength: 3
                  maxLength: 16
                  pattern: '^.*?$'

      responses:
        204:
          $ref: '#/components/responses/noContent'
        400:
          $ref: '#/components/responses/badRequest'
        404:
          $ref: '#/components/responses/notFound'
        500:
          $ref: '#/components/responses/internalServerError'
      security:
        - bearerAuth: [ ]

  /users/{id}/home:
    parameters:
      - $ref: '#/components/parameters/userId'

    get:
      tags: [ Feed ]
      summary: Obtain the stream
      description: Get all the photos (stream) from the following users
      operationId: getMyStream

      responses:
        '200':
          $ref: "#/components/responses/feed"
        '401':
          $ref: "#/components/responses/unauthorized"
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: "#/components/responses/notFound"
        '500':
          $ref: "#/components/responses/internalServerError"

      security:
        - bearerAuth: [ ]
  /users/{id}/photos:
    post:
      tags: [ Photo ]
      summary: Upload a new photo for a user
      description: Allows an authenticated user to upload a new photo.
      operationId: uploadPhoto
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: A schema representing the photo file to be uploaded
              properties:
                photo:
                  type: string
                  format: binary
                  description: The photo file to be uploaded in binary format.
                  minLength: 0
                  maxLength: 100
      responses:
        201:
          $ref: '#/components/responses/photoUploaded'
        400:
          $ref: '#/components/responses/badRequest'
        500:
          $ref: '#/components/responses/internalServerError'
      security:
        - bearerAuth: [ ]


  /users/{id}/photos/{photo_id}:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/photoId'
    delete:
      tags: [ Photo ]
      summary: Deletes a specific photo
      description: Deletes a photo that belongs to a user. This operation requires the user to be the owner of the photo.
      operationId: deletePhoto
      responses:
        '204':
          $ref: "#/components/responses/noContent"
        '401':
          $ref: "#/components/responses/unauthorized"
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: "#/components/responses/notFound"
        '500':
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
    get:
      tags: [ Photo ]

      summary: Retrieves a specific photo
      description: Retrieves detailed information about a specific photo of a user.
      operationId: getPhoto

      responses:
        '200':
          description: The photo was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/photo'
        '401':
          $ref: "#/components/responses/unauthorized"
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: "#/components/responses/notFound"
        '500':
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]


  /users/{id}/photos/{photo_id}/likes/{like_id}:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/like_id'
      - $ref: '#/components/parameters/photoId'
    put:
      tags: [ Social ]
      summary: Like a photo
      description: Adds a like to a specific photo. Each user can like the photo only once.
      operationId: likePhoto
      responses:
        204:
          $ref: '#/components/responses/noContent'

        404:
          $ref: '#/components/responses/notFound'
        401:
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]
    delete:
      tags: [ Social ]
      summary: Unlike a photo
      description: Removes a like from a specific photo.
      operationId: unlikePhoto
      responses:
        204:
          $ref: '#/components/responses/noContent'

        404:
          $ref: '#/components/responses/notFound'
        401:
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: "#/components/responses/internalServerError"
      security:
        - bearerAuth: [ ]

  /users/{id}/photos/{photo_id}/comments:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/photoId'
    post:
      tags: [ Social ]
      summary: Comment on a photo
      operationId: commentPhoto
      description: Adds a comment to a specific photo posted by a user.

      requestBody:
        description: Contains the user ID of the commenter and the comment text.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/comment'

      responses:
        201:
          description: The comment was successfully added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  commentId:
                    type: integer
                    description: The unique identifier for the newly added comment.
                    example: 101
                    minimum: 0
                    maximum: 9999

        400:
          $ref: '#/components/responses/badRequest'
        404:
          $ref: '#/components/responses/notFound'
        401:
          $ref: '#/components/responses/unauthorized'
        500:
          $ref: '#/components/responses/internalServerError'
      security:
        - bearerAuth: [ ]

  /users/{id}/photos/{photo_id}/comments/{commentId}:

    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/photoId'
      - $ref: '#/components/parameters/commentId'
    delete:
      tags: [ Social ]
      summary: Delete a comment from a photo
      description: Deletes a specific comment from a photo posted by a user.
      operationId: uncommentPhoto

      responses:
        204:
          $ref: '#/components/responses/noContent'
        404:
          $ref: '#/components/responses/notFound'
        401:
          $ref: '#/components/responses/unauthorized'


      security:
        - bearerAuth: [ ]

  /users/{id}/followers/{followerId}:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/followerId'
    put:
      tags: [ Social ]
      summary: Follow a user
      description: Allows an authenticated user to follow another user.
      operationId: followUser
      responses:
        204:
          $ref: '#/components/responses/noContent'
        401:
          $ref: '#/components/responses/unauthorized'
      security:
        - bearerAuth: [ ]
    delete:
      tags: [ Social ]
      summary: Unfollow a user
      description: Allows an authenticated user to unfollow another user they are currently following.
      operationId: unfollowUser
      responses:
        204:
          $ref: '#/components/responses/noContent'
        401:
          $ref: '#/components/responses/unauthorized'
      security:
        - bearerAuth: [ ]

  /users/{id}/banned_users/{bannedId}:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/bannedId'


    put:
      tags: [ User ]
      summary: Ban a user
      operationId: banUser
      description: Prevent a user from viewing your profile and interacting with your content.
      responses:
        204:
          $ref: '#/components/responses/noContent'

        404:
          $ref: '#/components/responses/notFound'
        401:
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: "#/components/responses/internalServerError"

      security:
        - bearerAuth: [ ]

    delete:
      tags: [ User ]
      summary: Unban a user
      operationId: unbanUser
      description: Allows a user to remove the ban placed on another user, restoring access to their profile.
      responses:
        204:
          $ref: '#/components/responses/noContent'

        404:
          $ref: '#/components/responses/notFound'
        401:
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: "#/components/responses/internalServerError"

      security:
        - bearerAuth: [ ]

components:
  parameters:
    userId:
      name: id
      in: path
      description: Unique identifier for a user. It must be between 3 and 16 characters long.
      required: true
      schema:
        description: A unique user identifier that follows a specific pattern and length constraint.
        type: string
        pattern: '^[a-zA-Z0-9]{3,16}$'
        example: "user123"
        minLength: 3
        maxLength: 16
        readOnly: true

    photoId:
      name: photo_id
      in: path
      description: Unique identifier for a photo, used in photo-related endpoints.
      required: true
      schema:
        description: Integer identifier for a photo, ranging from 0 to 9999.
        type: integer
        format: int64
        example: 789
        minimum: 0
        maximum: 9999
        readOnly: true

    commentId:
      name: commentId
      in: path
      description: A unique identifier for a comment.
      required: true
      schema:
        type: integer
        description: Integer identifier for a comment within a post, typically used to manage individual comments.
        example: 101
        minimum: 0
        maximum: 9999

    followerId:
      name: followerId
      in: path
      description: Unique identifier for a follower of a user.
      required: true
      schema:
        type: string
        description: Identifier for the user following another user.
        pattern: '^[a-zA-Z0-9]{3,16}$'
        example: "user456"
        minLength: 3
        maxLength: 16

    like_id:
      name: like_id
      in: path
      description: Unique identifier for a "like", representing the user who liked the photo.
      required: true
      schema:
        type: string
        description: The user ID of the person who liked the photo.
        pattern: '^[a-zA-Z0-9]{3,16}$'
        example: "Massimo123"
        minLength: 3
        maxLength: 16


    bannedId:
      name: bannedId
      in: path
      description: Unique identifier for a banned user, typically the username or ID of the banned user.
      required: true
      schema:
        $ref: "#/components/schemas/nickname/properties/nickname"
      example: "Massimo"

    query_id:
      name: id
      in: query
      description: Unique identifier of the user being searched. It must be between 3 and 16 characters long.
      schema:
        type: string
        description: Identifier used for searching a specific user.
        pattern: '^[a-zA-Z0-9]{3,16}$'
        minLength: 3
        maxLength: 16
        example: "maria123"

  schemas:

    nickname:
      description: It's a user's nickname schema used for profile identification.
      type: object
      properties:
        nickname:
          description: The nickname chosen by the user, allowing 3-16 characters.
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "massimo123"
      example:
        nickname: "Massimo123"

    user:
      type: object
      description: Contains the unique identifier and nickname of a user.
      properties:
        user_id:
          type: string
          description: A globally unique identifier for the user.
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "User2024"
          minLength: 3
          maxLength: 16
        nickname:
          type: string
          description: The nickname chosen by the user.
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "NatureLover"
          minLength: 3
          maxLength: 16

    comment_identifier:
      type: object
      description: Unique identifier for a comment within the system.
      properties:
        comment_id:
          type: integer
          description: Any number between 0 and 9999 that uniquely identifies a comment.
          format: int64
          minimum: 0
          maximum: 9999
          readOnly: true
          example: 256

    comment:
      type: object
      description: Details about a user's comment, including the text and the identifier of who commented.
      properties:
        user_id:
          type: string
          description: The unique identifier of the user who made the comment.
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "User3030"
          minLength: 3
          maxLength: 16
        nickname:
          type: string
          description: The nickname of the user who made the comment.
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "StarGazer"
          minLength: 3
          maxLength: 16
        comment:
          type: string
          description: The text content of the comment made by the user.
          minLength: 1
          maxLength: 300
          example: "This landscape is breathtaking!"
        comment_id:
          type: integer
          description: A unique identifier for the comment within the system.
          example: 991

    raw_photo:
      description: Schema for raw photo data used for uploading and storing photos.
      type: object
      properties:
        photo_data:
          description: The binary data representing the photo.
          type: string
          minLength: 0
          maxLength: 100
          format: binary
          example: "010110000"
      example:
        photo_data: "010110000"

    photo:
      description: Contains essential information of a photo, including its metadata and interactions.
      type: object
      properties:
        comments:
          description: An array of comments associated with the photo.
          type: array
          minItems: 0
          maxItems: 9999
          items:
            $ref: "#/components/schemas/comment"
        likes:
          description: List of users who liked the photo.
          type: array
          minItems: 0
          maxItems: 9999
          items:
            $ref: "#/components/schemas/user"
        date:
          description: The timestamp indicating when the photo was uploaded.
          type: string
          format: date-time
          example: 2023-04-14T09:22:05Z
          readOnly: true
        photo_id:
          type: integer
          description: A unique identifier for the photo.
          example: 1045
        owner:
          type: string
          description: The nickname of the user who uploaded the photo.
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "LensMaster"
          minLength: 3
          maxLength: 16

    photos_list:
      description: Represents a collection of photos uploaded by different users.
      type: object
      properties:
        photos_list:
          description: A list containing detailed photo entries.
          type: array
          minItems: 0
          maxItems: 10
          items:
            $ref: "#/components/schemas/photo"

    users_list:
      description: Represents a list of users matching the search criteria.
      type: object
      properties:
        users:
          description: An array of users whose nickname partially or fully matches the searched nickname.
          type: array
          minItems: 0
          maxItems: 10
          items:
            $ref: "#/components/schemas/user"
          example:
            - user_id: Maria123
              nickname: Mari1
            - user_id: massimo12
              nickname: Massimo12

    complete_profile:
      description: Comprehensive profile information, including user details and associated content such as followers and photos.
      type: object
      properties:
        user_id:
          type: string
          description: A unique identifier for the user.
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "Adventurer123"
        nickname:
          type: string
          description: The nickname chosen by the user.
          pattern: '^[a-zA-Z0-9]{3,16}$'
          example: "TrailBlazer"
        followers:
          description: List of users who follow this user.
          type: array
          minItems: 0
          maxItems: 99
          items:
            $ref: "#/components/schemas/user"
        following:
          description: List of users that this user follows.
          type: array
          minItems: 0
          maxItems: 99
          items:
            $ref: "#/components/schemas/user"
        photos:
          description: Photos uploaded by the user, including metadata and interactions.
          type: array
          minItems: 0
          maxItems: 10
          items:
            $ref: "#/components/schemas/photo"

  responses:
    noContent:
      description: No content to return

    badRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            type: object
            description: Contains details about the invalid request.
            properties:
              status:
                description: HTTP status code indicating the error.
                type: integer
                example: 400
              error:
                type: string
                description: Short message describing the error.
                example: "Invalid parameters"
              details:
                type: string
                description: Detailed message explaining which parameters or fields were invalid.
                example: "The 'username' field is required."
    notFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            description: Contains details about the missing resource.
            properties:
              status:
                type: integer
                description: HTTP status code indicating the error.
                example: 404
              error:
                type: string
                description: Short message describing the error.
                example: "Resource not found"
              details:
                description: Detailed message explaining what resource was not found.
                type: string
                example: "The user with ID 'user123' does not exist."
    unauthorized:
      description: Authorization required or authorization failed
      content:
        application/json:
          schema:
            type: object
            description: Contains details about the authorization failure.
            properties:
              status:
                description: HTTP status code indicating the error.
                type: integer
                example: 401
              error:
                type: string
                description: Short message describing the error.
                example: "Unauthorized access"
              details:
                type: string
                description: Detailed message explaining why the authorization failed.
                example: "Bearer token is missing or invalid."
    forbidden:
      description: Access denied due to insufficient permissions (403 Forbidden).
      content:
        application/json:
          schema:
            type: object
            description: Contains details about the access denial.
            properties:
              status:
                type: integer
                description: HTTP status code indicating the error.
                example: 403
              error:
                type: string
                description: Short message describing the error.
                example: "Access denied"
              details:
                type: string
                description: Detailed message explaining why access was denied.
                example: "You do not have permission to view this resource."

    internalServerError:
      description: An unexpected internal server error occurred.
      content:
        application/json:
          schema:
            type: object
            description: Contains details about the server error.
            properties:
              status:
                type: integer
                description: HTTP status code indicating the error.
                example: 500
              error:
                type: string
                description: Short message describing the error.
                example: "Internal server error"
              details:
                type: string
                description: Detailed message explaining the nature of the server error.
                example: "An unexpected error occurred on the server."

    userProfile:
      description: Returns the full profile of the user, including details such as their ID, nickname, and full name.
      content:
        application/json:
          schema:
            type: object
            description: Contains the details of the user's profile.
            properties:
              status:
                type: integer
                description: HTTP status code indicating success.
                example: 200
              message:
                type: string
                description: Message confirming successful retrieval of the user profile.
                example: "User profile retrieved successfully."
              userId:
                type: string
                description: The unique ID of the user.
                example: "user123"
              nickname:
                type: string
                description: The user's nickname.
                example: "Maria"
              fullName:
                type: string
                description: The user's full name.
                example: "Maria Rossi"

    photoUploaded:
      description: Response indicating that a photo was uploaded successfully.
      content:
        application/json:
          schema:
            type: object
            description: Contains details about the uploaded photo.
            properties:
              status:
                type: integer
                description: HTTP status code indicating success.
                example: 201
              message:
                type: string
                description: Message confirming successful photo upload.
                example: "Photo uploaded successfully."
              photoId:
                type: string
                description: The unique ID of the uploaded photo.
                example: "photo789"
              url:
                type: string
                description: The URL or path to access the uploaded photo.
                example: "photo789"

    feed:
      description: Contains a list of photos from following users, displayed in reversed chronological order.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/photos_list"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authorization scheme that uses Bearer tokens for secure access to resources.
